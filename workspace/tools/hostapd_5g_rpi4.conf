# Known-good standalone 5 GHz AP on Pi 4 / CYW43455 under AAOS 16.
# Verified 2026-08-16: hostapd reaches AP-ENABLED, iw dev shows type AP, channel 36 (5180 MHz).
#
# Prerequisites:
#   svc wifi disable            # releases wlan0 from wpa_supplicant/the framework
#   iw reg set US               # kernel regdomain; brcmfmac otherwise sits at "99"
# Run:
#   /apex/com.android.hardware.wifi.hostapd.rpi/bin/hw/hostapd -dd <this file>
#   # NOTE: Android's hostapd logs to logcat (tag `hostapd`), NOT stdout.
# Then DHCP:
#   ip addr add 192.168.43.1/24 dev wlan0
#   dnsmasq --no-daemon --no-resolv --port=0 --interface=wlan0 --bind-interfaces \
#           --dhcp-authoritative --dhcp-range=192.168.43.100,192.168.43.200,12h
#
# ctrl_interface MUST be somewhere writable — /data/local/tmp fails with
# "mkdir[ctrl_interface]: Permission denied".
# Stay on channels 36-48: firmware 7.45.265 has a CLM regression on 149-165
# (raspberrypi/linux#7186).

interface=wlan0
driver=nl80211
ctrl_interface=/data/vendor/wifi/hostapd/ctrl_carlink
ssid=pi-carplay
country_code=US
ieee80211d=1
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=0
wmm_enabled=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=CHANGEME

# AAOS Raspberry Pi 5 Build Configuration
# ===========================================
# Edit these settings before running build_aaos.sh
# Lines starting with # are comments

# ===========================================
# BUILD VARIANT
# ===========================================
# Options: car, tablet, tv
# - car: Android Automotive (default)
# - tablet: Standard Android tablet
# - tv: Android TV
BUILD_VARIANT="car"

# Build type: userdebug, user, eng
# - userdebug: ADB root enabled, debugging, production-like (recommended)
# - user: Production build, no root
# - eng: Full engineering build with all debug tools
BUILD_TYPE="userdebug"

# ===========================================
# DISPLAY SETTINGS
# ===========================================
# Display density (DPI)
# Common values: 160 (mdpi), 240 (hdpi), 320 (xhdpi)
DISPLAY_DENSITY="160"

# Force specific display resolution (leave empty for auto-detect)
# Format: WIDTHxHEIGHT (e.g., 1920x1080, 1280x720)
DISPLAY_RESOLUTION="1920x1080"

# Screen brightness default (0-255)
SCREEN_BRIGHTNESS_DEFAULT="128"

# Screen brightness minimum (0-255)
SCREEN_BRIGHTNESS_MIN="20"

# Enable night mode by default
# Options: yes, no, auto
NIGHT_MODE="auto"

# ===========================================
# AUDIO SETTINGS
# ===========================================
# Default audio output device
# Options: hdmi, speaker, headphone
AUDIO_OUTPUT_DEVICE="hdmi"

# HDMI audio output (hdmi0, hdmi1)
HDMI_AUDIO_PORT="hdmi0"

# Media volume default (0-25)
MEDIA_VOLUME_DEFAULT="20"

# Media volume steps
MEDIA_VOLUME_STEPS="25"

# ===========================================
# NETWORK SETTINGS
# ===========================================
# WiFi country code (ISO 3166-1 alpha-2)
# Examples: US, GB, DE, JP, CN, 00 (world mode)
WIFI_COUNTRY_CODE="00"

# WiFi hotspot SSID
WIFI_HOTSPOT_SSID="Raspberry Pi 5"

# Enable 5GHz WiFi band
WIFI_5GHZ_ENABLED="yes"

# Enable WiFi background scanning
WIFI_BACKGROUND_SCAN="yes"

# Enable Bluetooth by default
BLUETOOTH_ENABLED="no"

# ===========================================
# HDMI CEC SETTINGS
# ===========================================
# Enable HDMI CEC
HDMI_CEC_ENABLED="yes"

# CEC device (cec0, cec1)
HDMI_CEC_DEVICE="cec0"

# Put TV to standby when device sleeps
HDMI_CEC_STANDBY_ON_SLEEP="no"

# ===========================================
# USB SETTINGS
# ===========================================
# Default USB gadget mode
# Options: mtp,adb | ptp,adb | adb | rndis,adb | midi,adb
USB_GADGET_MODE="mtp,adb"

# USB descriptor - Manufacturer name
USB_MANUFACTURER="Raspberry"

# USB descriptor - Product name
USB_PRODUCT="Pi 5"

# ===========================================
# SERIAL CONSOLE (UART)
# ===========================================
# Enable UART serial console on GPIO pins 8/10
UART_CONSOLE_ENABLED="yes"

# UART device (ttyAMA0 for GPIO header, ttyAMA10 for debug header)
UART_DEVICE="ttyAMA0"

# UART baud rate
UART_BAUD_RATE="115200"

# Enable early console for boot debugging
UART_EARLY_CONSOLE="yes"

# ===========================================
# DEVELOPMENT & ROOT ACCESS
# ===========================================
# Enable root access
ROOT_ACCESS_ENABLED="yes"

# ADB root enabled
ADB_ROOT_ENABLED="yes"

# Enable SSH server (Note: requires post-build setup)
SSH_ENABLED="yes"

# SELinux mode: enforcing, permissive
SELINUX_MODE="permissive"

# Disable package verification for sideloading
DISABLE_PACKAGE_VERIFICATION="yes"

# Skip setup wizard
SKIP_SETUP_WIZARD="yes"

# Disable lockscreen
DISABLE_LOCKSCREEN="yes"

# Stay on while plugged in
STAY_ON_WHILE_PLUGGED="yes"

# Enable location services by default
LOCATION_ENABLED="no"

# ===========================================
# PARTITION SIZES
# ===========================================
# Boot partition size in MB
PARTITION_BOOT_MB="256"

# System partition size in MB
PARTITION_SYSTEM_MB="4096"

# Vendor partition size in MB
PARTITION_VENDOR_MB="512"

# Userdata partition size in MB
PARTITION_USERDATA_MB="1024"

# ===========================================
# DEVICE IDENTITY
# ===========================================
# Device serial number
DEVICE_SERIAL="rpi5"

# Device name (shown in Settings > About)
DEVICE_NAME="Raspberry Pi 5"

# ===========================================
# CAMERA SETTINGS
# ===========================================
# Enable camera support
CAMERA_ENABLED="no"

# Camera sensor (auto-detected if empty)
# Options: imx219, imx296, imx477, imx500, imx519, imx708, ov5647, ov64a40
CAMERA_SENSOR=""

# ===========================================
# CAR-SPECIFIC SETTINGS (only for BUILD_VARIANT=car)
# ===========================================
# Enable EVS (Exterior View System)
CAR_EVS_ENABLED="yes"

# EVS camera device (e.g., /dev/video0)
CAR_EVS_CAMERA="/dev/video0"

# Enable CAN bus support
CAR_CAN_ENABLED="no"

# ===========================================
# PERFORMANCE SETTINGS
# ===========================================
# Number of parallel build jobs (0 = auto-detect)
BUILD_JOBS="0"

# ccache size in GB
CCACHE_SIZE_GB="50"

# ===========================================
# INCLUDED APPS
# ===========================================
# Include Files/Documents app (DocumentsUI)
# Provides file browsing, document access, and storage management
FILES_APP_ENABLED="yes"

# Include Gallery app for viewing images/videos
GALLERY_APP_ENABLED="yes"

# Include Music app
MUSIC_APP_ENABLED="yes"

# Include Calendar app
CALENDAR_APP_ENABLED="yes"

# Include Calculator app
CALCULATOR_APP_ENABLED="yes"

# Include Contacts app
CONTACTS_APP_ENABLED="yes"

# Include Desk Clock (alarm/timer)
DESKCLOCK_APP_ENABLED="yes"

# ===========================================
# EXPERIMENTAL FEATURES
# ===========================================
# Enable HDR support (experimental)
HDR_ENABLED="no"

# Enable desktop mode
DESKTOP_MODE_ENABLED="yes"
